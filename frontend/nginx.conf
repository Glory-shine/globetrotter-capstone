server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip already-compressed static assets for faster loads.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cache hashed build assets aggressively; never cache index.html itself
    # so deploys are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router uses history mode — any unmatched path falls back to
    # index.html so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
